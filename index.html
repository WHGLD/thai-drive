<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLT Тренажёр</title>
<meta name="description" content="Тренажёр к теоретическому экзамену DLT (Таиланд): тесты по темам, мои ошибки, дорожные знаки.">
<meta name="theme-color" content="#0b5d45" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DLT Тест">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title">
      <h1 id="title">Тест</h1>
      <p id="subtitle"></p>
    </div>
    <span class="topbar-badge" id="topbar-badge" hidden></span>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Разделы">
    <button data-tab="test" class="active">
      <svg viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16.5" rx="2.2"/><path d="M9.2 3h5.6v3.2H9.2z"/><path d="M8.6 13.4l2.3 2.3 4.6-4.7"/></svg>
      <span>Тест</span>
    </button>
    <button data-tab="errors">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.3"/></svg>
      <span>Ошибки</span><i class="dot" id="err-dot" hidden></i>
    </button>
    <button data-tab="signs">
      <svg viewBox="0 0 24 24"><path d="M12 2.8l9.2 9.2-9.2 9.2L2.8 12z"/><path d="M12 8v4.5M12 15.6v.3"/></svg>
      <span>Знаки</span>
    </button>
    <button data-tab="numbers">
      <svg viewBox="0 0 24 24"><path d="M4.5 8.5l2-1.5v10M3.8 17h5.4"/><path d="M11.2 9a2.3 2.3 0 0 1 4.4.8c0 1.8-4.4 4.2-4.4 7.2h4.6"/><path d="M18 7.6a2 2 0 0 1 3.4 1.3c0 1.2-1 1.9-2.2 1.9 1.4 0 2.4.8 2.4 2.2a2.3 2.3 0 0 1-4 1.5"/></svg>
      <span>Цифры</span>
    </button>
    <button data-tab="words">
      <svg viewBox="0 0 24 24"><path d="M5 5.2A2.2 2.2 0 0 1 7.2 3H19v14.5H7.2A2.2 2.2 0 0 0 5 19.7z"/><path d="M5 19.7A2.2 2.2 0 0 0 7.2 22H19"/><path d="M9 13l2.2-6 2.2 6M9.8 11h2.8"/></svg>
      <span>Слова</span>
    </button>
  </nav>
</div>

<div class="modal" id="zoom" hidden>
  <img alt="" referrerpolicy="no-referrer">
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="data/data.js"></script>
<script src="data/numbers.js"></script>
<script src="app.js"></script>
</body>
</html>
